<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 简报存档</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #f4f4f2; --text: #1a1a1a; --muted: #6b7280;
    --accent: #2563eb; --border: #e5e5e1; --hover: #ebebe8; --active: #e0e7ff;
    --code-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10; --panel: #17181a; --text: #e8e8e6; --muted: #9ca3af;
      --accent: #7da2ff; --border: #2a2b2e; --hover: #1f2023; --active: #1e2b45;
      --code-bg: #1d1e21;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: flex; min-height: 100vh; }
  aside { width: 250px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--panel); padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside h1 { font-size: 15px; font-weight: 700; padding: 0 18px 12px; margin: 0; border-bottom: 1px solid var(--border); }
  .group-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; padding: 16px 18px 6px; }
  .item { display: block; padding: 7px 18px; font-size: 13px; color: var(--text); text-decoration: none; cursor: pointer; border-left: 3px solid transparent; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); border-left-color: var(--accent); font-weight: 600; }
  .item .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  main { flex: 1; max-width: 820px; padding: 40px 48px 80px; }
  main article { font-size: 16px; line-height: 1.75; }
  main h1 { font-size: 26px; line-height: 1.3; margin: 0 0 8px; }
  main h2 { font-size: 20px; margin-top: 36px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  main h3 { font-size: 17px; margin-top: 28px; }
  main p { margin: 14px 0; }
  main a { color: var(--accent); text-decoration: none; }
  main a:hover { text-decoration: underline; }
  main code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-size: .88em; }
  main pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
  main pre code { background: none; padding: 0; }
  main blockquote { border-left: 3px solid var(--accent); margin: 16px 0; padding: 2px 16px; color: var(--muted); }
  main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
  main th, main td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  main th { background: var(--panel); }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 5px 0; }
  main hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .empty { color: var(--muted); text-align: center; padding-top: 120px; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 24px; font-size: 13px; }
  .toolbar a { color: var(--muted); }
  .loading { color: var(--muted); padding: 60px 0; text-align: center; }
  .menu-btn { display: none; position: fixed; top: 12px; left: 12px; z-index: 10; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--text); }
  @media (max-width: 760px) {
    aside { position: fixed; left: -260px; transition: left .2s; z-index: 9; }
    aside.open { left: 0; }
    .menu-btn { display: block; }
    main { padding: 60px 20px 60px; }
  }
</style>
</head>
<body>
<button class="menu-btn" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
<div class="layout">
  <aside id="nav"><h1>AI 简报存档</h1><div class="loading">加载目录…</div></aside>
  <main id="content"><div class="empty">← 从左侧选一期开始阅读</div></main>
</div>
<script>
const REPO = 'LISOP9527/ai-briefings';
const API = `https://api.github.com/repos/${REPO}/contents`;
const RAW = `https://raw.githubusercontent.com/${REPO}/main`;

const GROUPS = [
  { dir: 'briefings', label: 'AI / 科研简报' },
  { dir: 'deals',     label: '内测 / 低价额度监控' },
];

function fmtName(f) {
  // 2026-09-30-1020.md → 09-30 10:20 ; 2026-09-30.md → 09-30
  const m = f.name.match(/(\d{4})-(\d{2})-(\d{2})(?:-(\d{2})(\d{2}))?/);
  if (!m) return { main: f.name, sub: '' };
  return m[4]
    ? { main: `${m[2]}-${m[3]} ${m[4]}:${m[5]}`, sub: m[1] }
    : { main: `${m[2]}-${m[3]}`, sub: m[1] };
}

async function loadIndex() {
  const nav = document.getElementById('nav');
  let html = '<h1>AI 简报存档</h1>';
  const all = [];
  for (const g of GROUPS) {
    let files = [];
    try {
      const r = await fetch(`${API}/${g.dir}`);
      if (r.ok) files = (await r.json()).filter(f => f.name.endsWith('.md'));
    } catch (e) {}
    files.sort((a, b) => b.name.localeCompare(a.name));
    html += `<div class="group-title">${g.label}</div>`;
    for (const f of files) {
      const t = fmtName(f);
      const id = `${g.dir}/${f.name}`;
      all.push(id);
      html += `<a class="item" data-path="${id}" href="#${encodeURIComponent(id)}">${t.main}${t.sub ? `<span class="sub">${t.sub}</span>` : ''}</a>`;
    }
  }
  nav.innerHTML = html;
  nav.querySelectorAll('.item').forEach(el =>
    el.addEventListener('click', () => {
      document.querySelector('aside').classList.remove('open');
      loadFile(el.dataset.path);
    }));
  // hash routing or default to newest
  const fromHash = location.hash ? decodeURIComponent(location.hash.slice(1)) : null;
  if (fromHash && all.includes(fromHash)) loadFile(fromHash);
  else if (all.length) loadFile(all[0]);
}

async function loadFile(path) {
  document.querySelectorAll('.item').forEach(el =>
    el.classList.toggle('active', el.dataset.path === path));
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载中…</div>';
  history.replaceState(null, '', '#' + encodeURIComponent(path));
  try {
    const r = await fetch(`${RAW}/${path}`);
    if (!r.ok) throw new Error(r.status);
    const md = await r.text();
    const html = DOMPurify.sanitize(marked.parse(md));
    const rawUrl = `https://github.com/${REPO}/blob/main/${path}`;
    content.innerHTML = `<div class="toolbar"><a href="${rawUrl}" target="_blank">GitHub 原文 ↗</a></div><article>${html}</article>`;
    window.scrollTo(0, 0);
  } catch (e) {
    content.innerHTML = `<div class="empty">加载失败（${e.message}）</div>`;
  }
}

window.addEventListener('hashchange', () => {
  const p = decodeURIComponent(location.hash.slice(1));
  if (p) loadFile(p);
});
loadIndex();
</script>
</body>
</html>
